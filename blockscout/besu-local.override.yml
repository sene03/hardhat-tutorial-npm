services:
  backend:
    networks:
      - default
      - besu-network
    environment:
      ETHEREUM_JSONRPC_VARIANT: besu
      ETHEREUM_JSONRPC_HTTP_URL: http://besu-node1:8545/
      ETHEREUM_JSONRPC_TRACE_URL: http://besu-node1:8545/
      ETHEREUM_JSONRPC_WS_URL: ws://besu-node1:8546/
      CHAIN_ID: "1337"
      NETWORK: "Local Besu"
      SUBNETWORK: "QBFT"
      COIN: "ETH"
      COIN_NAME: "Ether"
      DISABLE_MARKET: "true"
      INDEXER_DISABLE_PENDING_TRANSACTIONS_FETCHER: "true"
      INDEXER_DISABLE_INTERNAL_TRANSACTIONS_FETCHER: "true"
      INDEXER_DISABLE_BLOCK_REWARD_FETCHER: "true"

  frontend:
    environment:
      NEXT_PUBLIC_APP_PROTOCOL: http
      NEXT_PUBLIC_APP_HOST: localhost:4000
      NEXT_PUBLIC_API_PROTOCOL: http
      NEXT_PUBLIC_API_HOST: localhost:4000
      NEXT_PUBLIC_API_BASE_PATH: /
      NEXT_PUBLIC_API_WEBSOCKET_PROTOCOL: ws
      NEXT_PUBLIC_NETWORK_ID: "1337"
      NEXT_PUBLIC_NETWORK_NAME: Local Besu
      NEXT_PUBLIC_NETWORK_SHORT_NAME: Local Besu
      NEXT_PUBLIC_NETWORK_CURRENCY_NAME: Ether
      NEXT_PUBLIC_NETWORK_CURRENCY_SYMBOL: ETH
      NEXT_PUBLIC_NETWORK_CURRENCY_DECIMALS: "18"
      NEXT_PUBLIC_STATS_API_HOST: http://localhost:4001
      NEXT_PUBLIC_VISUALIZE_API_HOST: http://localhost:4002

  proxy:
    ports: !override
      - "4000:80"
      - "4001:8080"
      - "4002:8081"

networks:
  besu-network:
    external: true
    name: qbft-network_besu-network
