services:
  node1:
    image: hyperledger/besu:latest
    container_name: besu-node1
    volumes:
      - ./Node-1/data:/var/lib/besu
      - ./genesis.json:/etc/besu/genesis.json
    ports:
      - "8545:8545"
      - "8546:8546"
      - "30303:30303"
    command:
      - --data-path=/var/lib/besu
      - --genesis-file=/etc/besu/genesis.json
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-cors-origins=*
      - --rpc-http-api=ETH,NET,QBFT,WEB3,MINER,ADMIN
      - --rpc-ws-enabled=true
      - --rpc-ws-host=0.0.0.0
      - --rpc-ws-port=8546
      - --p2p-port=30303
      - --p2p-host=0.0.0.0
      - --host-allowlist=*
      - --min-gas-price=0
      - --logging=INFO
    networks:
      besu-network:
        ipv4_address: 172.16.239.11

  node2:
    image: hyperledger/besu:latest
    container_name: besu-node2
    volumes:
      - ./Node-2/data:/var/lib/besu
